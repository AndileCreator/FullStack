<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Page</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container1">
    <h1>Register Person</h1>
    <p>Please fill in details below.</p>
</div>
<div class="container2">
    <form>
        <label for="name">Full Name</label>
        <br>
        <input type="text" id="name" name="name" placeholder="Please enter your full name."></input>
        <br>
        <label for="email">Email</label><br>
        <input type="text" id="email" name="email" placeholder="Enter your email."></input>
        <br>
        <input type="submit" value="SUBMIT"></input>
    </form>
</div>
</body>
</html>
